# Middlewares.
#
# Files in this directory are merged by Traefik's file provider. Split so that
# optional pieces (OIDC in 30-auth.yml) drop in or out without editing a shared
# document. Load order does not matter; the provider merges by key.

http:
  middlewares:
    cors:
      headers:
        accessControlAllowOriginList:
          - "*"
        accessControlAllowHeaders:
          - "*"
        accessControlAllowMethods:
          - "*"
        accessControlMaxAge: 3600
        addVaryHeader: true

    # Generated by ./utils/generate-htpasswd.sh from DASHBOARD_USERNAME and
    # DASHBOARD_PASSWORD. Superseded when 30-auth.yml puts Studio behind OIDC;
    # see docs/oidc.md.
    studio-auth:
      basicAuth:
        usersFile: "/etc/traefik/htpasswd"

    strip-auth:
      stripPrefix:
        prefixes: ["/auth/v1"]
    strip-rest:
      stripPrefix:
        prefixes: ["/rest/v1"]
    strip-realtime:
      stripPrefix:
        prefixes: ["/realtime/v1"]
    strip-realtime-api:
      stripPrefix:
        prefixes: ["/realtime/v1/api"]
    strip-storage:
      stripPrefix:
        prefixes: ["/storage/v1"]
    strip-functions:
      stripPrefix:
        prefixes: ["/functions/v1"]

    graphql-headers:
      headers:
        customRequestHeaders:
          Content-Profile: "graphql_public"

    replace-graphql:
      replacePath:
        path: "/rpc/graphql"
