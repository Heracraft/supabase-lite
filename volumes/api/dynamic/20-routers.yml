# Routers.
#
# The gateway checks only that a credential is PRESENT; it never compares the
# value. PostgREST (PGRST_JWT_SECRET), GoTrue, Storage and Realtime each
# validate the JWT themselves, so value matching here added no security while
# putting the service_role key into config the Traefik API renders back out.
#
# Every gated router also admits Method(`OPTIONS`). Without it a browser CORS
# preflight, which carries no apikey header, matches no router at all.
#
# Priorities are explicit everywhere. Traefik's default priority is the rule
# string's length, which reshuffles silently whenever a rule is edited.
#
#   100  specific sub-paths that must beat their own prefix
#    90  prefixes shadowed by a 100-level route
#    80  ordinary service prefixes
#     1  studio catch-all, always last

http:
  routers:
    # Auth: open endpoints. GoTrue validates the token carried in the URL.
    auth-verify:
      rule: "PathPrefix(`/auth/v1/verify`)"
      service: auth
      middlewares: [strip-auth, cors]
      priority: 100
    auth-callback:
      rule: "PathPrefix(`/auth/v1/callback`)"
      service: auth
      middlewares: [strip-auth, cors]
      priority: 100
    auth-authorize:
      rule: "PathPrefix(`/auth/v1/authorize`)"
      service: auth
      middlewares: [strip-auth, cors]
      priority: 100

    auth-secure:
      rule: "PathPrefix(`/auth/v1/`) && (Method(`OPTIONS`) || HeaderRegexp(`apikey`, `.+`) || QueryRegexp(`apikey`, `.+`) || HeaderRegexp(`Authorization`, `Bearer .+`))"
      service: auth
      middlewares: [strip-auth, cors]
      priority: 80

    rest:
      rule: "PathPrefix(`/rest/v1/`) && (Method(`OPTIONS`) || HeaderRegexp(`apikey`, `.+`) || QueryRegexp(`apikey`, `.+`) || HeaderRegexp(`Authorization`, `Bearer .+`))"
      service: rest
      middlewares: [strip-rest, cors]
      priority: 80

    graphql:
      rule: "PathPrefix(`/graphql/v1`) && (Method(`OPTIONS`) || HeaderRegexp(`apikey`, `.+`) || QueryRegexp(`apikey`, `.+`) || HeaderRegexp(`Authorization`, `Bearer .+`))"
      service: graphql
      middlewares: [replace-graphql, graphql-headers, cors]
      priority: 80

    # /realtime/v1/api is a subset of /realtime/v1/, so it must outrank it.
    realtime-api:
      rule: "PathPrefix(`/realtime/v1/api`) && (Method(`OPTIONS`) || HeaderRegexp(`apikey`, `.+`) || QueryRegexp(`apikey`, `.+`) || HeaderRegexp(`Authorization`, `Bearer .+`))"
      service: realtime-rest
      middlewares: [strip-realtime-api, cors]
      priority: 100

    realtime-ws:
      rule: "PathPrefix(`/realtime/v1/`) && (Method(`OPTIONS`) || HeaderRegexp(`apikey`, `.+`) || QueryRegexp(`apikey`, `.+`) || HeaderRegexp(`Authorization`, `Bearer .+`))"
      service: realtime-ws
      middlewares: [strip-realtime, cors]
      priority: 90

    # Storage and Functions are ungated here, matching Kong's behaviour. Both
    # validate the JWT themselves.
    storage:
      rule: "PathPrefix(`/storage/v1/`)"
      service: storage
      middlewares: [strip-storage, cors]
      priority: 80

    functions:
      rule: "PathPrefix(`/functions/v1/`)"
      service: functions
      middlewares: [strip-functions, cors]
      priority: 80

    # NOTE: there is deliberately no /pg/ route to postgres-meta.
    #
    # postgres-meta performs no authentication of its own and its /query
    # endpoint executes arbitrary SQL as a privileged role. Kong gated it on a
    # literal service_role key match; a presence check is not an adequate
    # substitute. Studio does not need the route either, it reaches the service
    # directly over the compose network via STUDIO_PG_META_URL.
    #
    # See docs/gateway.md before re-adding it.

    # Studio is a SPA and needs the root prefix, but it must not swallow the
    # API namespaces. Without these exclusions a request to /rest/v1/ carrying
    # no credential falls through to here and answers with
    # `WWW-Authenticate: Basic`, which pops a login dialog in the browser and
    # advertises how the dashboard is protected. Excluded, the same request
    # matches no router and Traefik returns a plain 404.
    #
    # /analytics/v1/ stays excluded even though nothing serves it now. It is
    # still an API namespace, and a leftover client should get a clean 404
    # rather than a basic-auth dialog from the dashboard.
    #
    # 30-auth.yml overrides this router to route through oauth2-proxy.
    studio:
      rule: >-
        PathPrefix(`/`)
        && !PathPrefix(`/rest/v1/`)
        && !PathPrefix(`/auth/v1/`)
        && !PathPrefix(`/realtime/v1/`)
        && !PathPrefix(`/storage/v1/`)
        && !PathPrefix(`/functions/v1/`)
        && !PathPrefix(`/graphql/v1`)
        && !PathPrefix(`/analytics/v1/`)
      service: studio
      middlewares: [studio-auth]
      priority: 1
