# The API and dashboard are off.
#
# `insecure: true` served the dashboard and /api/rawdata unauthenticated on
# :8080 to every container on the compose network, including `functions`, which
# runs user-supplied Deno code. /api/rawdata renders router rules verbatim, so
# while the rules held literal keys it also handed out the service_role key.
#
# To inspect routers during development, override it for one run without
# editing this file:
#   docker compose run --rm --service-ports traefik --api.insecure=true
api:
  dashboard: false
  insecure: false

entryPoints:
  web:
    address: ":8000"
  websecure:
    address: ":8443"
  # Scraped by Prometheus over the observability network. Deliberately not
  # published to the host.
  metrics:
    address: ":8082"

# Traefik fronts every Supabase service, so its per-router request rate,
# latency and status-code series cover the whole stack without instrumenting
# any Supabase container. This is most of what Studio's Reports tab showed
# before analytics was removed.
metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true

# JSON so log shippers do not have to parse a bespoke text format.
accessLog:
  format: json
  fields:
    headers:
      defaultMode: drop
      names:
        User-Agent: keep

# Fragments in volumes/api/dynamic/ are merged into one dynamic config, so
# optional pieces drop in or out as whole files. A directory mount also makes
# `watch` work: bind-mounting a single file pins the container to that inode,
# and editors that write-and-rename leave the container reading the old one.
providers:
  file:
    directory: "/etc/traefik/dynamic"
    watch: true

log:
  level: INFO
