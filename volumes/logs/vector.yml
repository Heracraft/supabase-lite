api:
  enabled: true
  address: 0.0.0.0:9001

sources:
  docker_host:
    type: docker_logs
    exclude_containers:
      - supabase-vector

transforms:
  project_logs:
    type: remap
    inputs:
      - docker_host
    source: |-
      .project = "default"
      .event_message = del(.message)
      .appname = del(.container_name)
      del(.container_created_at)
      del(.container_id)
      del(.source_type)
      del(.stream)
      del(.label)
      del(.image)
      del(.host)
      del(.stream)
  router:
    type: route
    inputs:
      - project_logs
    route:
      traefik: '.appname == "supabase-traefik"'
      auth: '.appname == "supabase-auth"'
      rest: '.appname == "supabase-rest"'
      realtime: '.appname == "realtime-dev.supabase-realtime"'
      storage: '.appname == "supabase-storage"'
      functions: '.appname == "supabase-edge-functions"'
      db: '.appname == "supabase-db"'
  # Traefik's access log is configured as JSON in volumes/api/traefik.yml, so
  # there is no bespoke text format to regex apart. Startup and error lines are
  # not JSON; they pass through with their message intact rather than being
  # dropped, which is what the old Kong transforms did with anything that
  # failed to parse as an nginx line.
  traefik_logs:
    type: remap
    inputs:
      - router.traefik
    source: |-
      parsed, err = parse_json(.event_message)
      if err == null {
          .timestamp = parsed.time
          .metadata.request.method = parsed.RequestMethod
          .metadata.request.path = parsed.RequestPath
          .metadata.request.protocol = parsed.RequestProtocol
          # Quoted: VRL reads a bare hyphen as subtraction.
          .metadata.request.headers.user_agent = parsed."request_User-Agent"
          .metadata.response.status_code = parsed.DownstreamStatus
          .metadata.router = parsed.RouterName
          .metadata.service = parsed.ServiceName
          .metadata.duration_ms = parsed.Duration
      }
  # Gotrue logs are structured json strings which frontend parses directly. But we keep metadata for consistency.
  auth_logs:
    type: remap
    inputs:
      - router.auth
    source: |-
      parsed, err = parse_json(.event_message)
      if err == null {
          .metadata.timestamp = parsed.time
          .metadata = merge!(.metadata, parsed)
      }
  # PostgREST logs are structured so we separate timestamp from message using regex
  rest_logs:
    type: remap
    inputs:
      - router.rest
    source: |-
      parsed, err = parse_regex(.event_message, r'^(?P<time>.*): (?P<msg>.*)$')
      if err == null {
          .event_message = parsed.msg
          .timestamp = to_timestamp!(parsed.time)
          .metadata.host = .project
      }
  # Filter out healthcheck logs from Realtime
  realtime_logs_filtered:
    type: filter
    inputs:
      - router.realtime
    condition: '!contains(string!(.event_message), "/health")'
  # Realtime logs are structured so we parse the severity level using regex (ignore time because it has no date)
  realtime_logs:
    type: remap
    inputs:
      - realtime_logs_filtered
    source: |-
      .metadata.project = del(.project)
      .metadata.external_id = .metadata.project
      parsed, err = parse_regex(.event_message, r'^(?P<time>\d+:\d+:\d+\.\d+) \[(?P<level>\w+)\] (?P<msg>.*)$')
      if err == null {
          .event_message = parsed.msg
          .metadata.level = parsed.level
      }
  # Function logs are unstructured messages on stderr
  functions_logs:
    type: remap
    inputs:
      - router.functions
    source: |-
      .metadata.project_ref = del(.project)
  # Storage logs may contain json objects so we parse them for completeness
  storage_logs:
    type: remap
    inputs:
      - router.storage
    source: |-
      .metadata.project = del(.project)
      .metadata.tenantId = .metadata.project
      parsed, err = parse_json(.event_message)
      if err == null {
          .event_message = parsed.msg
          .metadata.level = parsed.level
          .metadata.timestamp = parsed.time
          .metadata.context[0].host = parsed.hostname
          .metadata.context[0].pid = parsed.pid
      }
  # Postgres logs some messages to stderr which we map to warning severity level
  db_logs:
    type: remap
    inputs:
      - router.db
    source: |-
      .metadata.host = "db-default"
      .metadata.parsed.timestamp = .timestamp

      parsed, err = parse_regex(.event_message, r'.*(?P<level>INFO|NOTICE|WARNING|ERROR|LOG|FATAL|PANIC?):.*', numeric_groups: true)

      if err != null || parsed == null {
        .metadata.parsed.error_severity = "info"
      }
      if parsed.level != null {
       .metadata.parsed.error_severity = parsed.level
      }
      if .metadata.parsed.error_severity == "info" {
          .metadata.parsed.error_severity = "log"
      }
      .metadata.parsed.error_severity = upcase!(.metadata.parsed.error_severity)

sinks:
  # One sink replaces the seven per-service Logflare HTTP sinks. Every source
  # and transform above is kept: the GoTrue JSON parse, the PostgREST timestamp
  # split, the Postgres severity extraction and the Realtime level regex are
  # what make these lines queryable with `| json` in LogQL.
  loki:
    type: loki
    inputs:
      - traefik_logs
      - auth_logs
      - rest_logs
      - realtime_logs
      - storage_logs
      - functions_logs
      - db_logs
      # Everything the router did not match: studio, meta, imgproxy, supavisor,
      # oauth2-proxy, db-exporter. Logflare dropped these; Loki has no reason
      # to, and an unshipped container log is one you go looking for at exactly
      # the wrong moment.
      - router._unmatched
    endpoint: ${LOKI_ENDPOINT:-http://loki:3100}
    encoding:
      codec: json
    # Labels are the Loki index. Only low-cardinality values belong here;
    # anything request-scoped (path, status code, user agent) stays in the log
    # line and is queried with `| json`. Promoting a path to a label is how you
    # blow up the index.
    labels:
      service: "{{ appname }}"
      project: "{{ project }}"
    # Vector's own clock ordering rather than per-stream reordering; Loki 2.4
    # and later accept out-of-order writes within its window.
    out_of_order_action: accept
    remove_label_fields: true
